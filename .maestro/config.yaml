contracts:
  default: prompt
  strict: false
  overlapPolicy: fail
  rebaseFallback: best-effort
  staleReclaimContractPolicy: inherit
sessionDetection:
  enabled: true
  agents:
    - claude-code
defaultWorkflow: plan-implement
memory:
  enabled: true
  corrections:
    enabled: true
    matching: keyword
    auto_capture: prompt
    severity_default: soft
  learnings:
    enabled: true
    compile_threshold: 5
    max_age_days: 7
  ratchet:
    enabled: false
    enforcement: warn
  graph:
    enabled: true
